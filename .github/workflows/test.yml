# Runs the deal ticket tests automatically on every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/deal-ticket
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/deal-ticket/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
